<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>medme-ehr 管理端（最小版）</title>
<style>
 :root{--fg:#1c1c1e;--mut:#6b6b70;--line:#e3e3e6;--bg:#fafafa;--acc:#0b6bcb}
 *{box-sizing:border-box} body{margin:0;font:14px/1.6 -apple-system,"Segoe UI",system-ui,"Noto Sans CJK SC",sans-serif;color:var(--fg);background:var(--bg)}
 header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline}
 h1{font-size:16px;margin:0} .ver{color:var(--mut);font-size:12px}
 main{display:grid;grid-template-columns:280px 1fr;gap:0;height:calc(100vh - 53px)}
 aside{border-right:1px solid var(--line);overflow:auto;padding:12px}
 section{overflow:auto;padding:16px 20px}
 button{font:inherit;padding:5px 10px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
 button:hover{border-color:var(--acc);color:var(--acc)}
 input,select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;width:100%}
 .row{display:flex;gap:8px;margin-bottom:10px} .row>*{flex:1}
 ul{list-style:none;margin:0;padding:0} li{padding:7px 8px;border-radius:6px;cursor:pointer}
 li:hover{background:#eef4fb} li.on{background:#e3efff;color:var(--acc);font-weight:600}
 table{border-collapse:collapse;width:100%} td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:13px;vertical-align:top}
 .mark{background:#ffe9a8;border-radius:2px}
 pre{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin:0}
 .mut{color:var(--mut)} .err{color:#c02626} pre.msg{color:#c02626}
 .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
 .tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>medme-ehr 管理端</h1>
  <span class="ver" id="ver">…</span>
  <span class="ver" style="margin-left:auto">真相层 = 原件 CAS + 事件日志 · 派生索引可重建</span>
  <span class="ver" id="tokwrap" style="margin-left:12px">token: <input id="token" type="password" placeholder="Bearer token（可留空=未开鉴权）" style="width:220px"></span>
</header>
<main>
<aside>
  <div class="row">
    <input id="newName" placeholder="新人员姓名">
    <button id="btnAdd">建档</button>
  </div>
  <ul id="plist"></ul>
</aside>
<section>
  <div class="tabs" id="tabs"></div>
  <div id="pane"></div>
</section>
</main>
<script>
const API = location.origin + "/api/v1";
let persons = [], cur = null, tab = "timeline";

// T4 鉴权：token 来自 URL ?token= 或 localStorage（不写死在页面里）。
// 页面本身是公开路径（免鉴权），但它的 XHR 必须带 token，否则 401。
function tok() {
  const u = new URL(location.href).searchParams.get("token");
  if (u) return u;
  try { return localStorage.getItem("ehr_token") || ""; } catch (e) { return ""; }
}
function setTok(v) {
  try { v ? localStorage.setItem("ehr_token", v) : localStorage.removeItem("ehr_token"); } catch (e) {}
  location.reload();
}
async function j(path, opt) {
  opt = opt || {};
  const t = tok();
  opt.headers = Object.assign({}, opt.headers || {});
  if (t) opt.headers["Authorization"] = "Bearer " + t;
  const r = await fetch(API + path, opt);
  const txt = await r.text();
  let d; try { d = JSON.parse(txt); } catch (e) { d = { raw: txt }; }
  if (!r.ok) throw new Error((d && d.error) || (r.status + " " + txt.slice(0,200)));
  return d;
}
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl = s => esc(s).replace(/\[([^\]]+)\]/g, '<span class="mark">$1</span>');

async function loadPersons() {
  persons = await j("/persons");
  const pl = document.getElementById("plist");
  pl.innerHTML = persons.map(p => `<li data-id="${p.id}" class="${cur===p.id?"on":""}">${esc(p.name)}</li>`).join("");
  [...pl.children].forEach(li => li.onclick = () => { cur = li.dataset.id; loadPersons(); render(); });
}
function tabs() {
  const t = ["timeline","documents","labs","home","search","meds","conds","audit","records","packages","tokens"];
  document.getElementById("tabs").innerHTML = t.map(x =>
    `<button data-t="${x}" class="${tab===x?"on":""}">${{timeline:"时间线",documents:"文档",labs:"指标",home:"自测趋势",search:"检索",meds:"用药",conds:"病程",audit:"审计",records:"记录",packages:"病程包",tokens:"令牌"}[x]}</button>`).join("");
  [...document.getElementById("tabs").children].forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
}
function out(html) { document.getElementById("pane").innerHTML = html; }
function fail(e) { out(`<pre class="msg">[ERROR] ${esc(e.message)}</pre>`); }

// T44：派生读面速览——上传原件后**服务端聚合是实时的**（同一次 parser::aggregate，
// 不需要重跑抽取），所以「上传完看不到用药/病程/指标」是**页面**没把新状态取回来，
// 不是产品没算。本函数在「文档」页渲染一次、在上传成功后随 render() 再渲染一次。
// ⚠️ 只读面：不新增端点、不写任何数据（口径与 D-060 同族）。
async function derivedView() {
  const el = document.getElementById("derived");
  if (!el) return;
  try {
    const [l, m, c] = await Promise.all([
      j(`/persons/${cur}/labs`), j(`/persons/${cur}/medications`), j(`/persons/${cur}/conditions`),
    ]);
    el.innerHTML = `<p class="mut">派生读面（随上传自动刷新 · 数值原样透传）</p>` +
      `<table><tr><th>读面</th><th>计数</th><th>参与文档</th></tr>` +
      `<tr><td>指标 labs</td><td>series=${(l.series_count!=null?l.series_count:(l.series||[]).length)} · points=${(l.total_points!=null?l.total_points:0)}</td><td class="mut">${esc(l.documents_scanned||0)}</td></tr>` +
      `<tr><td>用药 meds</td><td>med_count=${(m.med_count!=null?m.med_count:0)}</td><td class="mut">${esc(m.documents_scanned||0)}</td></tr>` +
      `<tr><td>病程 conds</td><td>condition_count=${(c.condition_count!=null?c.condition_count:0)}</td><td class="mut">${esc(c.documents_scanned||0)}</td></tr>` +
      `</table>`;
  } catch (e) {
    el.innerHTML = `<pre class="msg">[ERROR] ${esc(e.message)}</pre>`;
  }
}

async function render() {
  tabs();
  if (!cur) return out('<p class="mut">← 左侧选择或新建人员。</p>');
  const p = persons.find(x => x.id === cur);
  try {
    if (tab === "timeline") {
      const d = await j(`/persons/${cur}/timeline`);
      out(`<h2>${esc(p.name)} · 时间线 <span class="mut">count=${d.count}</span></h2>` +
        (d.count ? `<table><tr><th>日期</th><th>标题</th><th>类型</th></tr>` +
          d.items.map(i => `<tr><td>${esc((i.doc_date||"—").slice(0,10))}</td><td>${esc(i.title||"—")}</td><td class="mut">${esc(i.doc_type||"")}</td></tr>`).join("") + `</table>`
          : '<p class="mut">该人员暂无记录。上传 txt/pdf 后此处出现。</p>'));
    } else if (tab === "documents") {
      const d = await j(`/persons/${cur}/documents`);
      out(`<h2>${esc(p.name)} · 文档 <span class="mut">count=${d.count}</span></h2>` +
        `<div class="row"><input type="file" id="f"><button id="up">上传原件</button></div>` +
        `<div id="derived"><p class="mut">派生读面加载中…</p></div>` +
        (d.count ? `<table><tr><th>sha256</th><th>文件名</th><th>大小</th></tr>` +
          d.items.map(i => `<tr><td><a href="#" data-sha="${i.content_hash}" class="det">${esc((i.content_hash||"").slice(0,12))}…</a></td><td>${esc(i.original_name||"")}</td><td class="mut">${esc(i.byte_size)} B · ${esc(i.mime_type)}</td></tr>`).join("") + `</table>`
          : '<p class="mut">暂无文档。</p>'));
      const up = document.getElementById("up");
      if (up) up.onclick = async () => {
        const f = document.getElementById("f").files[0]; if (!f) return alert("先选文件");
        const fd = new FormData(); fd.append("file", f);
        try { const r = await j(`/persons/${cur}/documents`, { method: "POST", body: fd });
          alert(`已入库 sha=${(r.content_hash||"").slice(0,12)}… deduped=${!!r.deduped}`); render();
        } catch (e) { alert("上传失败: " + e.message); }
      };
      // 页面「文档」页一进来就把派生读面取回来；上传成功后 render() 会重建该页，
      // 因此上传后**自动**再取一次 ⇒ 用户当场看见「用药/病程/指标」因这次上传而变化。
      derivedView();
      document.querySelectorAll("a.det").forEach(a => a.onclick = async ev => {
        ev.preventDefault();
        try { const d = await j(`/persons/${cur}/documents/${a.dataset.sha}`);
          out(`<h2>${esc(d.filename)}</h2><p class="mut">sha256=${esc(d.sha256)}</p><pre>${esc((d.text||"").slice(0,4000))}</pre>`);
        } catch (e) { fail(e); }
      });
    } else if (tab === "labs") {
      const d = await j(`/persons/${cur}/labs`);
      out(`<h2>${esc(p.name)} · 指标 <span class="mut">series=${(d.series||[]).length}</span></h2>` +
        ((d.series||[]).length ? (d.series||[]).map(s =>
          `<h3>${esc(s.group_name||s.analyte_key||"未命名序列")} <span class="mut">${esc(s.unit_canonical||"")} · n=${(s.points||[]).length}${s.any_abnormal?" · 异常":""}</span></h3><table><tr><th>日期</th><th>值</th><th>flag</th><th>证据</th></tr>` +
          (s.points||[]).map(pt => `<tr><td>${esc(pt.date||"—")}</td><td>${esc(pt.value)}${esc(s.unit_canonical?" "+s.unit_canonical:"")}</td><td>${esc(pt.flag||"")}</td><td class="mut">${esc((pt.docref||"").slice(0,12))}</td></tr>`).join("") + `</table>`).join("")
          : '<p class="mut">无已解析指标。上传含检验数据的 txt 报告后重试。</p>'));
    } else if (tab === "meds") {
      // 用药跨度（D-026 读面已毕业，此前页面未接）——与指标同源：同一次 parser::aggregate 的另一块输出。
      const d = await j(`/persons/${cur}/medications`);
      out(`<h2>${esc(p.name)} · 用药 <span class="mut">med_count=${(d.med_count!=null?d.med_count:0)} · mention_count=${(d.mention_count!=null?d.mention_count:0)} · docs=${(d.documents_scanned!=null?d.documents_scanned:0)}</span></h2>` +
        ((d.medications||[]).length ? (d.medications||[]).map(m =>
          `<h3>${esc(m.name||"—")} <span class="mut">${esc(m.atc||"")} · ${esc(m.status||"")}${m.latest_dose?" · "+esc(m.latest_dose):""}${m.unverified?" · 未核对":""}</span></h3>` +
          `<table><tr><th>起</th><th>止</th><th>剂型/原文名</th><th>证据</th></tr>` +
          (m.docrefs||[]).map(s => `<tr><td>${esc(m.start||"—")}</td><td>${esc(m.end||"—")}</td><td class="mut">${esc((m.raw_names||[]).join(" / "))}</td><td class="mut">${esc(s.slice(0,12))}</td></tr>`).join("") + `</table>`).join("")
          : '<p class="mut">无可解析的用药记录。上传含处方/药品的 txt 原件后重试。</p>'));
    } else if (tab === "conds") {
      // 病程泳道（D-027 读面已毕业，此前页面未接）——诊断原文原样透传，不做术语归一。
      const d = await j(`/persons/${cur}/conditions`);
      out(`<h2>${esc(p.name)} · 病程 <span class="mut">condition_count=${(d.condition_count!=null?d.condition_count:0)} · docs=${(d.documents_scanned!=null?d.documents_scanned:0)}</span></h2>` +
        ((d.conditions||[]).length ? `<table><tr><th>诊断原文</th><th>首现</th><th>ICD</th><th>证据</th></tr>` +
          (d.conditions||[]).map(c => `<tr><td>${esc(c.raw_text||"—")}</td><td>${esc(c.onset||"—")}</td><td class="mut">${esc(c.icd_code||"—")}</td><td class="mut">${esc((c.docrefs||[]).map(s=>s.slice(0,12)).join(" "))}</td></tr>`).join("") + `</table>`
          : '<p class="mut">无可解析的诊断记录。上传含诊断的 txt 原件后重试。</p>'));
    } else if (tab === "audit") {
      // 审计视图（D-030 读面已毕业，此前页面未接）——真相层事件日志的投影，只读。
      const d = await j(`/audit?person=${encodeURIComponent(cur)}`);
      out(`<h2>审计 · ${esc(p.name)} <span class="mut">count=${(d.count!=null?d.count:0)}</span></h2>` +
        ((d.entries||[]).length ? `<table><tr><th>时刻</th><th>来源</th><th>动作</th><th>概要</th><th>sha256</th></tr>` +
          (d.entries||[]).map(e => `<tr><td class="mut">${esc((e.ts||"").slice(0,19))}</td><td>${esc(e.source||"")}</td><td>${esc(e.op||"")}</td><td>${esc(e.detail||"—")}</td><td class="mut">${esc((e.sha256||"").slice(0,12))}</td></tr>`).join("") + `</table>`
          : '<p class="mut">该人员暂无审计条目。</p>'));
    } else if (tab === "records") {
      // 写侧「手工条目」面板（T5 第 3 小步）：三种没有原件的记录（自测/笔记/病程事件）
      // 走 REST 的三个 POST 端点（D-028 已毕业，此前页面只能读不能写），
      // 并把回放投影（GET /measurements）列在下方 ⇒ 写完立刻能看到自己写的东西。
      // 口径纪律：单位/值**原样**提交（服务端做生理学合理性校验并回 400），
      // 事件日期 at = **事件发生的那天**（不是记录那天）；诊断/状态不推断。
      const AN = ["bp_systolic","bp_diastolic","heart_rate","body_weight","body_temperature","glucose"];
      out(`<h2>${esc(p.name)} · 记录 <span class="mut">写入=手工条目 · 无原件的记录</span></h2>` +
        `<h3>自测值</h3><div class="row">` +
          `<select id="mKey">${AN.map(k=>`<option value="${k}">${k}</option>`).join("")}</select>` +
          `<input id="mVal" placeholder="数值，如 128" inputmode="decimal">` +
          `<input id="mUnit" placeholder="单位，如 mmHg" value="mmHg">` +
          `<input id="mAt" placeholder="时刻(可空) 如 2026-10-01T08:00:00Z">` +
          `<button id="addMeas">记一条</button></div>` +
        `<h3>笔记</h3><div class="row"><input id="nText" placeholder="原文即内容"><button id="addNote">记一条</button></div>` +
        `<h3>病程事件</h3><div class="row">` +
          `<input id="pKind" placeholder="kind，如 enable" value="enable" list="peKinds">` +
          `<input id="pPkg" placeholder="病种包，如 sle" value="sle" list="pePkgs">` +
          `<input id="pAt" placeholder="事件那天 YYYY-MM-DD">` +
          `<input id="pPayload" placeholder="payload JSON 对象" value="{}">` +
          `<button id="addPe">记一条</button></div>` +
        `<datalist id="peKinds"></datalist><datalist id="pePkgs"></datalist>` +
        `<h3>已写入的记录（回放投影）</h3><div id="recList"><p class="mut">加载中…</p></div>`);
      const refresh = async () => {
        const d = await j(`/persons/${cur}/measurements`);
        const el = document.getElementById("recList");
        if (!el) return;
        // T45：kind / 病种包的候选项**从这个人已写入的事件里派生**（不硬编码语义表），
        //   且只作为**输入建议**（datalist）——候选来源是回放投影里的 event_kind/event_package。
        const kinds = [...new Set((d.measurements || [])
          .filter(m => m.kind === "profile_event" && m.event_kind)
          .map(m => m.event_kind))].sort();
        const pkgs = [...new Set((d.measurements || [])
          .filter(m => m.kind === "profile_event" && m.event_package)
          .map(m => m.event_package))].sort();
        const dk = document.getElementById("peKinds");
        if (dk) dk.innerHTML = kinds.map(k => `<option value="${esc(k)}"></option>`).join("");
        const dp = document.getElementById("pePkgs");
        if (dp) dp.innerHTML = pkgs.map(k => `<option value="${esc(k)}"></option>`).join("");
        el.innerHTML = (d.measurements||[]).length
          ? `<p class="mut">count=${d.count}</p><table><tr><th>时刻</th><th>类型</th><th>内容</th><th>证据</th></tr>` +
            d.measurements.map(m => `<tr><td class="mut">${esc((m.taken_at||"").slice(0,19))}</td>` +
              `<td>${esc(m.kind||"")}</td>` +
              `<td>${esc(m.kind==="self_measurement" ? (m.values||[]).map(v=>`${v.analyte_key}=${v.value}${v.unit?" "+v.unit:""}`).join(" / ") : (m.kind==="note" ? (m.text||"") : `${m.event_kind||""} ${m.event_package||""} @${m.event_at||""}`))}</td>` +
              `<td class="mut">${esc((m.docref||"").slice(0,12))}</td></tr>`).join("") + `</table>`
          : `<p class="mut">该人员暂无手工记录。</p>`;
      };
      const post = async (url, body, label) => {
        try {
          const r = await j(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
          alert(`${label}成功 sha=${(r.content_hash||"").slice(0,12)}… deduped=${!!r.deduped}`);
          await refresh();
        } catch (e) { alert(`${label}失败: ${e.message}`); }
      };
      const addMeas = document.getElementById("addMeas");
      if (addMeas) addMeas.onclick = () => {
        const key = document.getElementById("mKey").value;
        const val = parseFloat(document.getElementById("mVal").value);
        const unit = document.getElementById("mUnit").value.trim();
        const at = document.getElementById("mAt").value.trim();
        if (!isFinite(val)) return alert("数值不合法");
        const body = { values: [{ analyte_key: key, value: val, unit: unit }] };
        if (at) body.taken_at = at;
        post(`/persons/${cur}/entries/self-measurement`, body, "自测值");
      };
      const addNote = document.getElementById("addNote");
      if (addNote) addNote.onclick = () => {
        const t = document.getElementById("nText").value.trim();
        if (!t) return alert("笔记不能为空");
        post(`/persons/${cur}/entries/note`, { text: t }, "笔记");
      };
      const addPe = document.getElementById("addPe");
      if (addPe) addPe.onclick = () => {
        const at = document.getElementById("pAt").value.trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(at)) return alert("事件日期格式应为 YYYY-MM-DD");
        let pl = {};
        try { pl = JSON.parse(document.getElementById("pPayload").value || "{}"); }
        catch (e) { return alert("payload 不是合法 JSON"); }
        post(`/persons/${cur}/entries/profile-event`, {
          kind: document.getElementById("pKind").value.trim(),
          package: document.getElementById("pPkg").value.trim(),
          at, payload: pl,
        }, "病程事件");
      };
      try { await refresh(); } catch (e) { fail(e); }
    } else if (tab === "packages") {
      // 病程包视图（T45）：把「病程事件」按**病种包**分组列出来。
      // 数据源 = 写侧三类条目的回放投影（GET /measurements?kind=profile_event），
      //   字段全是服务端已经给好的：event_kind / event_package / event_at / event_payload。
      // 口径纪律（D-060 家族）：
      //   ① **原样透传** —— kind 印 kind 本身，payload 原样 JSON 字符串化，**不归一**；
      //   ② **不推断开关状态** —— 「这个包现在开没开」是上游 `profile::is_enabled`
      //      的语义（取最新 enable/disable）；本页**不重写那条规则**（D2：一个语义只允许一处实现），
      //      所以只按时间列出事件，**不**给「已开启/已关闭」标签；
      //   ③ 事件日期 = **事件发生的那天**（event_at），与记录时刻（taken_at）分开展示。
      const d = await j(`/persons/${cur}/measurements?kind=profile_event`);
      const evs = (d.measurements || []).filter(m => m.payload_readable);
      const byPkg = {};
      for (const m of evs) {
        const p = m.event_package || "?";
        (byPkg[p] = byPkg[p] || []).push(m);
      }
      const pkgs = Object.keys(byPkg).sort();
      out(`<h2>${esc(p.name)} · 病程包 <span class="mut">packages=${pkgs.length} · events=${evs.length}</span></h2>` +
        (pkgs.length ? pkgs.map(p => {
          const list = byPkg[p].slice().sort((a, b) =>
            String(a.event_at || "").localeCompare(String(b.event_at || "")));
          const kinds = [...new Set(list.map(m => m.event_kind || ""))].filter(Boolean);
          return `<h3>${esc(p)} <span class="mut">events=${list.length} · kinds=${esc(kinds.join(", "))}</span></h3>` +
            `<table><tr><th>事件日期</th><th>kind</th><th>payload</th><th>记录时刻</th><th>证据</th></tr>` +
            list.map(m => `<tr><td>${esc(m.event_at || "—")}</td>` +
              `<td>${esc(m.event_kind || "")}</td>` +
              `<td class="mut">${esc(m.event_payload ? JSON.stringify(m.event_payload) : "")}</td>` +
              `<td class="mut">${esc((m.taken_at || "").slice(0, 19))}</td>` +
              `<td class="mut">${esc((m.docref || "").slice(0, 12))}</td></tr>`).join("") + `</table>`;
        }).join("")
        : `<p class="mut">该人员还没有病程事件。在「记录」页写一条（kind / 病种包 / 事件日期）后此处出现。</p>`) +
        `<p class="mut">只读投影：事件与 payload 原样透传，<b>不推断</b>包的开关状态（那是上游 <code>profile::is_enabled</code> 的语义，不在本页重写）。</p>`);
    } else if (tab === "tokens") {
      // 令牌管理（T46）：列出/生成/吊销 API token。**整体要求 rw**（ro 管理令牌=提权）。
      // 列表只给 token 前 10 位指纹（明文只在创建回执出现一次——页面从不存明文）。
      const me = tok();
      let listHtml = "";
      try {
        const d = await j("/tokens");
        listHtml = `<table><tr><th>名称</th><th>scope</th><th>token 指纹</th><th>来源</th><th></th></tr>` +
          (d.tokens || []).map(t =>
            `<tr><td>${esc(t.name)}</td><td>${esc(t.scope)}</td>` +
            `<td><code>${esc(t.token_prefix)}…</code></td><td>${esc(t.source)}</td>` +
            `<td><button data-revoke="${esc(t.name)}" ${t.scope==="rw"&&t.name==="main"?"":"class='danger'"}>吊销</button></td></tr>`).join("") +
          `</table><p class="mut">提示：当前浏览器使用的 token 显示在右上角输入框（存 localStorage，不上传）。rw=读写，ro=只读。</p>`;
      } catch (e) {
        listHtml = `<p class="err">${esc(e.message)}</p><p class="mut">需要 <b>rw</b> 权限的 token（ro 无法管理令牌）。</p>`;
      }
      out(`<h2>API 令牌管理</h2>` +
        `<h3>生成新令牌</h3>` +
        `<p>名称: <input id="tk_name" placeholder="如 mobile-app" style="width:160px"> ` +
        `scope: <select id="tk_scope"><option value="ro">ro（只读）</option><option value="rw">rw（读写）</option></select> ` +
        `<button id="tk_create">生成</button></p><div id="tk_new"></div>` +
        `<h3>现有令牌</h3>` + listHtml);
      const btn = document.getElementById("tk_create");
      if (btn) btn.onclick = async () => {
        const name = (document.getElementById("tk_name").value||"").trim();
        const scope = document.getElementById("tk_scope").value;
        if (!name) { alert("请输入名称"); return; }
        try {
          const r = await j("/tokens", {method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({name, scope})});
          document.getElementById("tk_new").innerHTML =
            `<p class="ok">✅ 令牌已生成（<b>仅此一次显示明文</b>，请立即复制保存）：</p>` +
            `<p><code style="user-select:all">${esc(r.token)}</code></p>`;
          setTimeout(()=>location.reload(), 100);
        } catch (e) { alert("生成失败: " + e.message); }
      };
      document.querySelectorAll("[data-revoke]").forEach(b => b.onclick = async () => {
        const name = b.dataset.revoke;
        if (!confirm(`确定吊销 ${name}？使用该 token 的客户端将立即 401。`)) return;
        try { await j(`/tokens/${encodeURIComponent(name)}`, {method:"DELETE"}); location.reload(); }
        catch (e) { alert("吊销失败: " + e.message); }
      });

    } else if (tab === "home") {
      // 家庭自测趋势（T32）：**只**读 /measurements?kind=self_measurement。
      // ⚠️ 与「指标」页**刻意分开展示**：家庭自测值与医院指标参考区间不同，
      // 永不能画成同一条线（上游 GroupKey::SelfMeasured 的结构约束，见 docs/API.md）。
      const d = await j(`/persons/${cur}/measurements?kind=self_measurement`);
      const rows = (d.measurements || []).filter(m => m.payload_readable);
      // 按 analyte_key 归组（血压两条值共享一条记录 ⇒ 一行两个值）
      const g = {};
      for (const m of rows) for (const v of (m.values || [])) {
        const k = v.analyte_key || "?";
        (g[k] = g[k] || []).push({ m, v });
      }
      const keys = Object.keys(g);
      out(`<h2>${esc(p.name)} · 自测趋势 <span class="mut">count=${d.count} · 分组=${keys.length}</span></h2>` +
        `<p class="mut">来源：<code>GET /persons/{pid}/measurements?kind=self_measurement</code>（家庭自测，<b>不与医院指标混用参考区间</b>）</p>` +
        (keys.length ? keys.map(k => {
          const items = g[k].sort((a,b) => (a.m.taken_at||"").localeCompare(b.m.taken_at||""));
          const v0 = items[0].v;
          return `<h3>${esc(k)} <span class="mut">${esc(v0.unit||"")} · n=${items.length}</span></h3>` +
            `<table><tr><th>日期</th><th>值</th><th>flag</th><th>家庭区间</th><th>证据</th></tr>` +
            items.map(({m,v}) => `<tr><td>${esc((m.taken_at||"—").slice(0,10))}</td>` +
              `<td>${esc(v.value)}${esc(v.unit?" "+v.unit:"")}</td>` +
              `<td>${esc(v.flag||"—")}</td>` +
              `<td class="mut">${esc((v.ref_low!=null||v.ref_high!=null) ? (v.ref_low!=null?v.ref_low:"") + " ~ " + (v.ref_high!=null?v.ref_high:"") : "—")}</td>` +
              `<td class="mut">${esc((m.docref||"").slice(0,12))}</td></tr>`).join("") + `</table>` +
            (v0.ref_source ? `<p class="mut">区间出处：${esc(v0.ref_source)}</p>` : "");
        }).join("")
          : '<p class="mut">暂无家庭自测记录。可用 <code>ehr.sh measurements PID --kind self_measurement</code> 查看（写入走 REST <code>POST /persons/{pid}/entries/self-measurement</code>）。</p>'));
    } else {
      out(`<h2>${esc(p.name)} · 检索</h2><div class="row"><input id="q" placeholder="如：血常规"><button id="go">搜索</button></div><div id="res"></div>`);
      const go = document.getElementById("go");
      const run = async () => {
        const q = document.getElementById("q").value.trim(); if (!q) return;
        try { const d = await j(`/persons/${cur}/search?q=${encodeURIComponent(q)}`);
          document.getElementById("res").innerHTML = `<p class="mut">q=${esc(d.q)} count=${d.count}</p>` +
            (d.items||[]).map(i => `<h3>${esc(i.title||"")}</h3><pre>${hl(i.snippet||"")}</pre>`).join("");
        } catch (e) { fail(e); }
      };
      go.onclick = run; document.getElementById("q").onkeydown = e => { if (e.key === "Enter") run(); };
    }
  } catch (e) { fail(e); }
}

document.getElementById("btnAdd").onclick = async () => {
  const name = document.getElementById("newName").value.trim(); if (!name) return;
  try { const p = await j("/persons", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name }) });
    document.getElementById("newName").value = ""; cur = p.id; await loadPersons(); render();
  } catch (e) { alert("建档失败: " + e.message); }
};

(async () => {
  const ti = document.getElementById("token");
  ti.value = tok();
  ti.onchange = () => setTok(ti.value.trim());
  try { const o = await (await fetch("/openapi.json")).json();
    document.getElementById("ver").textContent = `${o.info.title} v${o.info.version} · paths=${Object.keys(o.paths||{}).length}`;
  } catch (e) { document.getElementById("ver").textContent = "openapi 不可达"; }
  try { await loadPersons(); } catch (e) { fail(e); }
  render();
})();
</script>
</body>
</html>
