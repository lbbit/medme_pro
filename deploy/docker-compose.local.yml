# medme-ehr · T2 编排 A：**本地构建**（无 ghcr 依赖，源码即真相）
# 用法：
#   cd deploy && cp .env.sample .env && docker compose -f docker-compose.local.yml up -d --build
#
# ⚠️ D4：up 之后必看容器 stderr 的 [证据] 行
#   （形如 `[证据] ehr-api v0.0.1 | mode=serve | EHR_HOME=/home/ehr | ADDR=0.0.0.0:8443`），
#   它与实际 bind 同源(D1)。dry-run 自检：
#   docker compose -f docker-compose.local.yml run --rm --no-deps ehr-api --print-openapi >/dev/null
services:
  # init-container(E6)：named volume 首次挂载会把镜像目录内容+属主(chown)复制过去 →
  # serve 阶段 prepare_home_and_state 对非 root 只校验不创建会失败(P2)。这里在 *volume* 内
  # mkdir+chown(不做落盘写)，顺带成为 /healthz 探针就绪门。见 DECISIONS P2/D-01x。
  boot:
    image: busybox
    command: ["sh", "-c", "mkdir -p /home/ehr && chown -R 10001:10001 /home/ehr && ls -ld /home/ehr"]
    volumes:
      - ehr-home:/home/ehr

  ehr-api:
    build:
      context: ..                                   # 仓库根（含 ehr-api + upstream-medme/packages/*）
      dockerfile: deploy/Dockerfile
      # ⚠️ extra_hosts 必须放在 **build** 下（透传给 buildkit 的 RUN 层）；
      #   只放服务级时 RUN 里 resolve 不了 host.docker.internal（D-016 教训，buildx --add-host 的 compose 等价物）。
      extra_hosts:
        - "host.docker.internal:host-gateway"       # 宿主 mihomo(allow-lan 后监听 *:7890)，docker0 网关可达
      args:                                         # D1：镜像源 URL 唯一定义处，Dockerfile 只做拼装模板
        CARGO_SPARSE_URL: ${CARGO_SPARSE_URL:-https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/}
        CARGO_STATIC_ROOT: ${CARGO_STATIC_ROOT:-https://static.crates.io}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:7890}
        HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:7890}
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
      cache_from:
        - rust:1-slim-bookworm                      # 基础层复用本地已 pull 的官方标签(daocloud mirror)
    init: true                                      # PID1 收割 + SIGTERM→ctrl-c(优雅停机,D-01x P4配套)
    restart: unless-stopped                         # host bind mount → serve fail-fast；重启策略安全(D-01x P3)
    depends_on:
      boot: { condition: service_completed_successfully }
    ports:
      - "${EHR_BIND_ADDR:-127.0.0.1}:${EHR_BIND_PORT:-8585}:8443"
    environment:
      EHR_HOME: ${EHR_HOME:-/home/ehr}              # uid=appuser(非 root),由 boot 预建属主 —— 见上 E6/P2
      EHR_ADDR: ${EHR_CONTAINER_ADDR:-0.0.0.0:8443}
      # T4 鉴权：静态 Bearer token（逗号分隔，格式 <token>[:ro|rw] 或 <name>=<token>[:ro|rw]）
      # 留空 = open 模式（不放行提示会写进容器 stderr 的 [证据] 行）。生产必须设置。
      EHR_API_TOKENS: ${EHR_API_TOKENS:-}
      EHR_API_TOKEN: ${EHR_API_TOKEN:-}
      RUST_LOG: info
    volumes:
      - ehr-home:/home/ehr                          # D-01x P3：host bind 会遮蔽镜像骨架，故用 named volume(+boot chown)

volumes:
  ehr-home:
